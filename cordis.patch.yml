# dsh-opencode — plugin bundle layer.
#
# 1. A keyless `opencode-zen` provider pointed at the local relay. This seed
#    provider makes the free models available on the very first boot, before the
#    host plugin has had a chance to write the profile's user patch. The host
#    plugin keeps the model list current in the user patch afterwards.
# 2. The host plugin that runs the relay inside DSH and syncs the free models.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-zen:
        displayName: OpenCode Zen (free)
        baseURL: "http://127.0.0.1:9360/v1"
        api: openai-completions
        compat:
          supportsReasoningEffort: true
        headers:
          Authorization: "Bearer zen-relay"
        models:
          - id: deepseek-v4.1-flash-free
            name: "DeepSeek V4.1 Flash (free)"
            contextWindow: 200000
            maxTokens: 32000
            input: [ text, image ]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: beam-free
            name: "Beam (free)"
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: mimo-v2.6-flash-free
            name: "MiMo-V2.6-Flash (free)"
            contextWindow: 200000
            maxTokens: 32000
            input: [ text, image ]
          - id: nemotron-3.5-super-vl-free
            name: "Nemotron 3.5 Super VL (free)"
            contextWindow: 1048576
            maxTokens: 131072
            input: [ text, image ]
            reasoningEfforts:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: nemotron-3.5-lightning-free
            name: "Nemotron 3.5 Lightning (free)"
            contextWindow: 262144
            maxTokens: 262144
          - id: jev-1.13-free
            name: "Jev-1.13 (free)"
          - id: longcat-2.5-preview-free
            name: "LongCat 2.5 Preview (free)"
            contextWindow: 1000000
            maxTokens: 131072
            input: [ text, image ]
          - id: glm-5.3-flash-free
            name: "GLM-5.3-Flash (free)"
            contextWindow: 200000
            maxTokens: 32000
            input: [ text, image ]
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: minimax-m3.1-flash-free
            name: "MiniMax M3.1 Flash (free)"
            contextWindow: 1000000
            maxTokens: 512000
            input: [ text, image ]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-zen
    model: deepseek-v4.1-flash-free
- insert:
    - id: dsh-opencode
      name: dsh-opencode
      config:
        port: 9360
        sync: true
